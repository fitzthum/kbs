[http_server]
sockets = ["0.0.0.0:8080"]
insecure_http = true

[attestation_token]
attestation_token_type = "Ear"
trusted_certs_paths = ["/opt/confidential-containers/kbs/user-keys/as-public.pem"]

[attestation_service]
type = "coco_as_grpc"
as_addr = "http://as:50004"

[admin]
auth_public_key = "/opt/confidential-containers/kbs/user-keys/public.pub"

[[plugins]]
name = "resource"
type = "LocalFs"
dir_path = "/opt/confidential-containers/kbs/repository"
